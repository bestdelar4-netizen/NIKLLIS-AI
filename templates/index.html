<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIKLLIS AI</title>

<style>
body{
margin:0;
background:#000;
color:#fff;
font-family:sans-serif;
display:flex;
flex-direction:column;
justify-content:space-between;
align-items:center;
height:100vh;
overflow:hidden;
}

.pet-container{
margin-top:20px;
text-align:center;
cursor:pointer;
}

.pet-avatar{
width:60px;
height:60px;
border-radius:50%;
background:#d946ef;
display:flex;
justify-content:center;
align-items:center;
font-size:30px;
margin:auto;
}

.pet-bubble{
margin-top:5px;
}

.siri-center{
flex:1;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
}

.siri-orb{
width:120px;
height:120px;
border-radius:50%;
background:conic-gradient(#3b82f6,#8b5cf6,#ec4899,#3b82f6);
animation:spin 3s linear infinite;
}

.speaking-orb{
animation:spin .7s linear infinite;
transform:scale(1.15);
}

@keyframes spin{
100%{filter:hue-rotate(360deg);}
}

.status-text{
margin-top:20px;
}

.chat-bar{
width:90%;
height:120px;
overflow:auto;
background:#111;
padding:10px;
margin-bottom:15px;
border-radius:10px;
}
</style>

</head>

<body onclick="initVoiceSystem()">

<div class="pet-container" onclick="feedPet(event)">
<div class="pet-avatar" id="petEmoji">👾</div>
<div class="pet-bubble" id="petMsg">اضغط للبدء</div>
</div>

<div class="siri-center">
<div id="siriOrb" class="siri-orb"></div>
<div id="statusText" class="status-text">اضغط في أي مكان</div>
</div>

<div class="chat-bar" id="chatBox">
<div>النظام جاهز...</div>
</div>

<script>

let recognition;
let isStarted=false;
let isSpeaking=false;

function initVoiceSystem(){

if(isStarted) return;
isStarted=true;

const SpeechRecognition=
window.SpeechRecognition||
window.webkitSpeechRecognition;

if(!SpeechRecognition){
alert("المتصفح لا يدعم التعرف الصوتي");
return;
}

recognition=new SpeechRecognition();

recognition.lang="ar-SA";
recognition.continuous=true;
recognition.interimResults=false;

recognition.onstart=function(){
statusText.innerText="سيري تستمع...";
};

recognition.onresult=function(event){

if(isSpeaking) return;

const text=
event.results[event.results.length-1][0].transcript.trim();

handleCommand(text);

};

recognition.onend=function(){

if(!isSpeaking){

setTimeout(function(){

try{
recognition.start();
}catch(e){}

},300);

}

};

try{

recognition.start();

statusText.innerText="متصل";

}catch(e){}

}

function feedPet(e){

e.stopPropagation();

const list=["👾","🤖","🐱","🦊"];

petEmoji.innerText=list[Math.floor(Math.random()*list.length)];

}

function handleCommand(text){

chatBox.innerHTML+="<div style='color:#38bdf8'>أنت: "+text+"</div>";

fetch("/process?cmd="+encodeURIComponent(text))

.then(r=>r.json())

.then(data=>{

chatBox.innerHTML+="<div style='color:#c084fc'>نيكليس: "+data.reply+"</div>";

chatBox.scrollTop=chatBox.scrollHeight;

speakSiri(data.reply);

});

}

function speakSiri(text){

window.speechSynthesis.cancel();

const utter=new SpeechSynthesisUtterance(text);

utter.lang="ar-SA";

utter.onstart=function(){

isSpeaking=true;

try{
recognition.stop();
}catch(e){}

siriOrb.className="siri-orb speaking-orb";

statusText.innerText="يتحدث...";

};

utter.onend=function(){

isSpeaking=false;

siriOrb.className="siri-orb";

statusText.innerText="تستمع...";

setTimeout(function(){

try{
recognition.start();
}catch(e){}

},300);

};

window.speechSynthesis.speak(utter);

}

</script>

</body>
</html>
